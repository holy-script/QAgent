{% extends "base.html" %}
{% block title %}Sign in - Demo Shop{% endblock %}
{% block content %}
<h1>Sign in</h1>
{# Deliberately like many real sign-in pages: the two fields have no ids and share one class. #}
<input class="w-full" type="text" placeholder="Enter your username" autocomplete="username"><br><br>
<input class="w-full" type="password" placeholder="Enter your password" autocomplete="current-password"><br><br>
<button class="w-full" onclick="signIn()">Sign in</button>
<p class="error" role="alert" id="login-error"></p>
{% endblock %}
{% block scripts %}
<script>
  async function signIn() {
    const [u, p] = document.querySelectorAll('input.w-full');
    const r = await api('/api/login', {username: u.value, password: p.value});
    if (r.status === 200) { location.href = '/account'; } else { document.getElementById('login-error').textContent = r.data.error; }
  }
</script>
{% endblock %}
