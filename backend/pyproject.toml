[project]
name = "qagent"
version = "0.1.0"
description = "QAgent QA Agent Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "sse-starlette>=2.1.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "httpx>=0.27.0",
    "playwright>=1.47.0",
    "langgraph>=0.2.20",
    "langchain-core>=0.3.0",
    "pyyaml>=6.0.2",
    "python-multipart>=0.0.12",
    "sqlmodel>=0.0.22",
    "sqlalchemy>=2.0.35",
    "psycopg[binary,pool]>=3.2.0",
    "alembic>=1.13.0",
    "boto3>=1.35.0",
    "markdown-it-py>=3.0.0",
    "simpleeval>=1.0.0",
    "structlog>=24.4.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "aiosqlite>=0.22.1",
    "langgraph-checkpoint-postgres>=3.1.2",
    "pillow>=12.3.0",
    "jinja2>=3.1.6",
    "axe-playwright-python>=0.1.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    "respx>=0.21.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "jinja2>=3.1.6",
]
